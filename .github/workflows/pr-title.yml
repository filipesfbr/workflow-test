name: PR title

# Gate de título: o PR de release é o changelog da versão, então o título importa.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest

    steps:
      - name: Título no padrão Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|chore|docs|refactor|test|ci|build|perf|release)(\([a-z0-9._-]+\))?: .{3,}'
          if [[ ! "$TITLE" =~ $padrao ]]; then
            echo "::error::Título fora do padrão: '$TITLE' — use 'tipo(escopo): descrição' (ex.: feat(recibos): total por extenso)"
            exit 1
          fi
          echo "Título ok: $TITLE"
