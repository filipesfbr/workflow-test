version: 2
updates:
  # As actions são referenciadas pela major (`@v7`, `@v3`). O Dependabot abre PR
  # quando sai minor/patch dentro da major — trocar de major (v7 -> v8) é decisão
  # humana, porque muda o runtime do runner.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
