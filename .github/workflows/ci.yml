name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Usado pelo bump.yml depois de commitar a versão na develop: push feito com
  # GITHUB_TOKEN não cria run de workflow, mas workflow_dispatch é a exceção.
  workflow_dispatch:

# Cancelar runs antigas do mesmo PR/branch economiza minutos do plano free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sem `--fix`: o CI falha, quem conserta é o dev.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Checks puros de regra de negócio: sem banco, sem rede, sem servidor.
      - name: Checks
        run: npm run checks
